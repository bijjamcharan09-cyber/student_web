<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Signup - Student Management System</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="auth-page-wrapper">

  <div class="brand-header">
    <a href="/" class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Student Management System</span>
    </a>
    <div class="brand-sub">Student Portal — Create Your Account</div>
  </div>

  <div class="card auth-card auth-card-md">
    <div id="alertBox"></div>

    <form onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="nameInput">Full Name *</label>
        <input type="text" id="nameInput" name="name" placeholder="e.g. Alex Morgan" autocomplete="name" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="usernameInput">Username *</label>
          <input type="text" id="usernameInput" name="username" placeholder="e.g. amorgan" autocomplete="username" minlength="3" required>
        </div>
        <div class="form-group">
          <label for="rollNumberInput">Roll Number</label>
          <input type="text" id="rollNumberInput" name="roll_number" placeholder="e.g. 25291A6605 (Optional)">
          <div class="input-hint">Leave blank to auto-generate</div>
        </div>
      </div>

      <div class="form-group">
        <label for="emailInput">Email Address *</label>
        <input type="email" id="emailInput" name="email" placeholder="e.g. alex.morgan@college.edu" autocomplete="email" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="passwordInput">Password *</label>
          <div class="password-wrapper">
            <input type="password" id="passwordInput" name="password" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('passwordInput', this)" aria-label="Show password" title="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPasswordInput">Confirm Password *</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPasswordInput" name="confirm_password" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPasswordInput', this)" aria-label="Show password" title="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Create Student Account</button>
    </form>

    <div class="footer-prompt">
      Already have an account? <a id="loginLink" href="/login">Login</a>
    </div>
  </div>

  <script>
    function isSafeUrl(target) {
      if (!target || typeof target !== 'string') return false;
      target = target.trim();
      if (!target.startsWith('/')) return false;
      if (target.startsWith('//') || target.startsWith('/\\')) return false;
      const pathPart = target.split('?')[0].split('#')[0];
      if (pathPart.includes(':') || target.includes('\\')) return false;
      return true;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const nextParam = params.get('next');
      if (nextParam && isSafeUrl(nextParam)) {
        const link = document.getElementById('loginLink');
        if (link) {
          link.href = `/login?next=${encodeURIComponent(nextParam)}`;
        }
      }
    });

    async function handleSignup(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      const name = document.getElementById('nameInput').value.trim();
      const username = document.getElementById('usernameInput').value.trim();
      const rollNumber = document.getElementById('rollNumberInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const confirmPassword = document.getElementById('confirmPasswordInput').value.trim();

      if (password !== confirmPassword) {
        showAlert('Passwords do not match. Please re-enter matching passwords.', 'danger');
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters long.', 'danger');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const payload = {
          name: name,
          username: username,
          email: email,
          password: password,
          confirm_password: confirmPassword
        };
        if (rollNumber) {
          payload.roll_number = rollNumber;
        }

        const res = await fetch('/api/v1/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (json.success) {
          showAlert('Account created successfully! Redirecting to login...', 'success');
          const params = new URLSearchParams(window.location.search);
          const nextParam = params.get('next');
          const safeNext = nextParam && isSafeUrl(nextParam) ? `&next=${encodeURIComponent(nextParam)}` : '';

          setTimeout(() => {
            if (window.location.protocol === 'file:' || window.location.pathname.endsWith('.html')) {
              window.location.href = `login.html?registered=1${safeNext}`;
            } else {
              window.location.href = `/login?registered=1${safeNext}`;
            }
          }, 800);
        } else {
          showAlert(json.error ? json.error.message : 'Registration failed. Please check your information.', 'danger');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Student Account';
        }
      } catch (err) {
        showAlert('Network error: Could not reach the server. Please verify the server is running.', 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Student Account';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      btn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
      btn.innerHTML = isPassword
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    function showAlert(msg, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = msg;
      alertBox.className = type === 'danger' ? 'alert-danger' : 'alert-success';
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
