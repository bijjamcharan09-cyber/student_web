<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin User Creation - Student Management System</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="auth-page-wrapper">

  <div class="brand-header">
    <a href="/" class="brand-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Student Management System</span>
    </a>
    <div class="brand-sub">Administrator Portal — Register New User</div>
  </div>

  <div class="card auth-card auth-card-lg">
    <div id="alertBox"></div>

    <!-- Role Selection Tabs for Administrator -->
    <div class="role-selector">
      <button type="button" class="role-btn active" id="btnRoleStudent" onclick="selectRole('Student')">🎓 Student</button>
      <button type="button" class="role-btn" id="btnRoleFaculty" onclick="selectRole('Faculty')">👨‍🏫 Faculty</button>
      <button type="button" class="role-btn" id="btnRoleAdmin" onclick="selectRole('Admin')">🛡️ Administrator</button>
    </div>

    <form id="registerForm" onsubmit="handleRegistration(event)">
      <input type="hidden" id="selectedRole" name="role" value="Student">

      <!-- Name Fields -->
      <div class="grid-2">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" name="first_name" placeholder="e.g. Ravi" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" placeholder="e.g. Kumar">
        </div>
      </div>

      <!-- Account Username & Email -->
      <div class="grid-2">
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" name="email" placeholder="ravi@example.com" required>
        </div>
        <div class="form-group">
          <label>Username (optional)</label>
          <input type="text" name="username" placeholder="Auto-generated if empty">
          <div class="input-hint">Derived from email if left blank</div>
        </div>
      </div>

      <!-- Role-specific extra fields: STUDENT -->
      <div id="studentFields">
        <div class="grid-2">
          <div class="form-group">
            <label>Roll Number (optional)</label>
            <input type="text" name="roll_number" placeholder="e.g. 25291A6601">
            <div class="input-hint">Links existing student or auto-generates new ID</div>
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="date_of_birth" value="2002-05-15">
          </div>
        </div>
      </div>

      <!-- Role-specific extra fields: FACULTY -->
      <div id="facultyFields" style="display: none;">
        <div class="grid-2">
          <div class="form-group">
            <label>Faculty Code / Employee ID</label>
            <input type="text" name="faculty_code" placeholder="e.g. FAC-101">
            <div class="input-hint">Auto-generated if blank</div>
          </div>
          <div class="form-group">
            <label>Department</label>
            <input type="text" name="department" value="Computer Science" placeholder="e.g. Computer Science">
          </div>
        </div>
      </div>

      <!-- Password Fields -->
      <div class="grid-2">
        <div class="form-group">
          <label>Password *</label>
          <div class="password-wrapper">
            <input type="password" name="password" id="passwordInput" minlength="6" placeholder="At least 6 characters" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('passwordInput', this)" aria-label="Show password" title="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password *</label>
          <div class="password-wrapper">
            <input type="password" name="confirm_password" id="confirmPasswordInput" minlength="6" placeholder="Repeat password" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPasswordInput', this)" aria-label="Show password" title="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Create User Account</button>
    </form>

    <div class="back-nav">
      <a href="/dashboard">← Back to Dashboard</a>
    </div>
  </div>

  <script>
    const authToken = localStorage.getItem('sms_auth_token') || '';

    function selectRole(role) {
      document.getElementById('selectedRole').value = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));

      if (role === 'Student') {
        document.getElementById('btnRoleStudent').classList.add('active');
        document.getElementById('studentFields').style.display = 'block';
        document.getElementById('facultyFields').style.display = 'none';
      } else if (role === 'Faculty') {
        document.getElementById('btnRoleFaculty').classList.add('active');
        document.getElementById('studentFields').style.display = 'none';
        document.getElementById('facultyFields').style.display = 'block';
      } else {
        document.getElementById('btnRoleAdmin').classList.add('active');
        document.getElementById('studentFields').style.display = 'none';
        document.getElementById('facultyFields').style.display = 'none';
      }
    }

    async function handleRegistration(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      const form = e.target;
      const pwd = form.password.value;
      const confirmPwd = form.confirm_password.value;

      if (pwd !== confirmPwd) {
        showAlert('Passwords do not match! Please check and retry.', 'danger');
        return;
      }

      const role = form.role.value;
      const payload = {
        email: form.email.value.trim(),
        password: pwd,
        role: role,
        first_name: form.first_name.value.trim(),
        last_name: form.last_name.value.trim()
      };

      if (form.username && form.username.value.trim()) {
        payload.username = form.username.value.trim();
      }

      if (role === 'Student') {
        if (form.roll_number.value.trim()) payload.roll_number = form.roll_number.value.trim();
        if (form.date_of_birth.value) payload.date_of_birth = form.date_of_birth.value;
      } else if (role === 'Faculty') {
        if (form.faculty_code.value.trim()) payload.faculty_code = form.faculty_code.value.trim();
        if (form.department.value.trim()) payload.department = form.department.value.trim();
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating user...';

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) {
          headers['Authorization'] = `Bearer ${authToken}`;
        }

        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (json.success) {
          showAlert(`User "${json.data.username}" (${json.data.role}) created successfully!`, 'success');
          form.reset();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create User Account';
        } else {
          showAlert(json.error ? json.error.message : 'User creation failed.', 'danger');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create User Account';
        }
      } catch (err) {
        showAlert('Network error: Could not reach the server.', 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create User Account';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      btn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
      btn.innerHTML = isPassword
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    function showAlert(msg, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = msg;
      alertBox.className = type === 'danger' ? 'alert-danger' : 'alert-success';
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
