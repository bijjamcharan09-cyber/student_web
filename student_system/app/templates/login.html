<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Student Management System</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 16px; }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-logo { display: inline-flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    .brand-sub { color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; }

    .card {
      background: var(--card-bg); width: 100%; max-width: 420px; border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid var(--border); padding: 32px;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: #fff;
    }
    .form-group input:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn-submit {
      width: 100%; background: var(--primary); color: white; border: none; padding: 12px;
      font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 8px;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 42px !important;
    }
    .password-toggle-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 4px;
      transition: color 0.2s;
    }
    .password-toggle-btn:hover {
      color: var(--primary);
    }
    .password-toggle-btn:focus-visible {
      outline: 2px solid var(--primary);
    }

    #alertBox {
      display: none; padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 18px; font-weight: 500;
    }
    .alert-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Student Management System</span>
    </div>
    <div class="brand-sub">Sign in to your portal</div>
  </div>

  <div class="card">
    <div id="alertBox"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="usernameInput">Username or Email Address *</label>
        <input type="text" id="usernameInput" name="username" placeholder="Enter your username or email" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password *</label>
        <div class="password-wrapper">
          <input type="password" id="passwordInput" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('passwordInput', this)" aria-label="Show password" title="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="/signup" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign up as Student</a>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('registered') === '1') {
        showAlert('Registration successful! Please sign in with your new student account.', 'success');
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const json = await res.json();
        if (json.success) {
          const user = json.data.user;
          showAlert(`Welcome, ${user.username}! Redirecting to your dashboard...`, 'success');
          if (json.data && json.data.token) {
            localStorage.setItem('sms_auth_token', json.data.token);
          }
          setTimeout(() => {
            if (window.location.protocol === 'file:' || window.location.pathname.endsWith('.html')) {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = '/dashboard';
            }
          }, 600);
        } else {
          showAlert(json.error ? json.error.message : 'Invalid username or password.', 'danger');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch (err) {
        showAlert('Could not reach the server. Please verify the backend is running.', 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      btn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
      btn.innerHTML = isPassword
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    function showAlert(msg, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = msg;
      alertBox.className = type === 'danger' ? 'alert-danger' : 'alert-success';
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
